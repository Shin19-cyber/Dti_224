<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Change</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Calculate Change</h1>
    </div>

    <div class="section">
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;">
            <label for="amount">Enter Amount:</label>
            <input type="number" id="amount" value="874" min="0" step="1" style="padding: 6px; width: 120px;">
            <button onclick="calculateChange()" class="back-button" style="padding: 6px 12px;">Submit</button>
        </div>

        <div id="result" style="text-align: center;"></div>
        <div id="error" style="color: #b00020; text-align: center; margin-top: 6px;"></div>
    </div>

    <div class="button-container">
        <a href="index.html" class="back-button">Back to Menu</a>
    </div>
</div>

<script>
    const denominations = [1000, 500, 100, 50, 20, 10, 5, 2, 1];

    function calculateChange() {
        const resultDiv = document.getElementById("result");
        const errorDiv = document.getElementById("error");
        resultDiv.innerHTML = "";
        errorDiv.innerHTML = "";

        let amount = Number(document.getElementById("amount").value);

        if (!Number.isInteger(amount) || amount < 0) {
            errorDiv.innerHTML = "Please enter a whole, non-negative number.";
            return;
        }

        let remaining = amount;
        let output = "";

        for (let i = 0; i < denominations.length; i++) {
            let denom = denominations[i];
            let count = 0;

            while (remaining >= denom) {
                remaining -= denom;
                count++;
            }

            if (count > 0) {
                output += "<p style='margin: 4px 0; font-size: 16px;'>" + count + " of &#3647;" + denom + "</p>";
            }
        }

        if (amount === 0) {
            output = "<p>&#3647;0 &mdash; no change needed.</p>";
        }

        resultDiv.innerHTML = output;
    }

    calculateChange();
</script>

</body>
</html>
