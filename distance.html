<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">
    <div class="header">
        <h1>How Far From University?</h1>
        <p>Kaung Htoo Tint | 240702404707</p>
        <p>University: Kasem Bundit University, Romklao Campus</p>
    </div>

    <div class="section" style="text-align: center;">
        <button onclick="checkDistance()" class="back-button" style="margin: 5px;">Check My Distance</button>
        <p id="status" style="color: #2563eb; font-weight: bold; margin-top: 10px;"></p>
        <div id="error" style="color: #b3261e; text-align: left; margin-top: 10px; font-size: 14px;"></div>
        <div id="result" style="text-align: left; margin-top: 10px; font-size: 14px; line-height: 1.6;"></div>
    </div>

    <div class="button-container">
        <a href="index.html" class="back-button">Back to Menu</a>
    </div>
</div>

<script>
    var uniLat = 13.8016;
    var uniLong = 100.7345;

    function checkDistance() {
        if (!navigator.geolocation) {
            document.getElementById("error").innerHTML =
                "Your browser does not support location services. Please try a different browser.";
            return;
        }
        document.getElementById("status").innerHTML = "Getting your location...";
        document.getElementById("error").innerHTML = "";
        document.getElementById("result").innerHTML = "";
        navigator.geolocation.getCurrentPosition(showDistance, showError, {
            timeout: 10000
        });
    }

    function showDistance(position) {
        var myLat = position.coords.latitude;
        var myLong = position.coords.longitude;
        var accuracy = position.coords.accuracy;

        var x = myLat - uniLat;
        var y = myLong - uniLong;

        var distance = Math.sqrt(x * x + y * y);
        var distanceKm = distance * 111;

        document.getElementById("status").innerHTML = "";
        document.getElementById("error").innerHTML = "";
        document.getElementById("result").innerHTML =
            "<b>Your Latitude:</b> " + myLat.toFixed(4) + "<br>" +
            "<b>Your Longitude:</b> " + myLong.toFixed(4) + "<br>" +
            "<b>Location Accuracy:</b> ±" + Math.round(accuracy) + " meters<br><br>" +
            "<b>University Latitude:</b> " + uniLat + "<br>" +
            "<b>University Longitude:</b> " + uniLong + "<br><br>" +
            "<b>Distance (degrees):</b> " + distance.toFixed(4) + "<br>" +
            "<b>Distance (approx. km):</b> " + distanceKm.toFixed(2) + " km";
    }

    function showError(error) {
        document.getElementById("status").innerHTML = "";
        var message = "Something went wrong while getting your location.";

        if (error.code === error.PERMISSION_DENIED) {
            message = "Could not access your location. Please turn on GPS and allow location access.";
        } else if (error.code === error.POSITION_UNAVAILABLE) {
            message = "Your location is currently unavailable. Please check GPS settings.";
        } else if (error.code === error.TIMEOUT) {
            message = "Getting your location took too long. Please try again.";
        }

        document.getElementById("error").innerHTML = message;
    }
</script>

</body>
</html>
