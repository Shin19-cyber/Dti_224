<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member List Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Member List</h1>
    </div>

    <div class="section">
        <div style="margin-bottom: 20px; text-align: center;">
            <input type="text" id="memberNameInput" placeholder="Enter member name" style="padding: 8px; width: 170px; font-size: 14px;">
            <button onclick="AddMember()" class="back-button" style="padding: 8px 10px;">Add</button>
            <button onclick="RemoveMember()" class="back-button" style="padding: 8px 10px; background-color: #dc2626;">Remove</button>
        </div>

        <h2>Current Members:</h2>
        <ul id="memberList"></ul>
    </div>

    <div class="button-container">
        <a href="index.html" class="back-button">Back to Menu</a>
    </div>
</div>

<script>
    function DisplayMemberList() {
        const listElement = document.getElementById("memberList");
        listElement.innerHTML = "";

        const members = JSON.parse(localStorage.getItem("members")) || [];

        members.forEach((member) => {
            const li = document.createElement("li");
            li.textContent = member;
            listElement.appendChild(li);
        });
    }

    function AddMember() {
        const input = document.getElementById("memberNameInput");
        const name = input.value.trim();

        if (name === "") {
            alert("Please enter a valid member name.");
            return;
        }

        let members = JSON.parse(localStorage.getItem("members")) || [];
        members.push(name);
        localStorage.setItem("members", JSON.stringify(members));

        input.value = "";
        DisplayMemberList();
    }

    function RemoveMember() {
        const input = document.getElementById("memberNameInput");
        const name = input.value.trim();

        if (name === "") {
            alert("Please enter a member name to remove.");
            return;
        }

        let members = JSON.parse(localStorage.getItem("members")) || [];
        const initialLength = members.length;
        members = members.filter(member => member.toLowerCase() !== name.toLowerCase());

        if (members.length === initialLength) {
            alert("Member not found.");
            return;
        }

        localStorage.setItem("members", JSON.stringify(members));
        input.value = "";
        DisplayMemberList();
    }

    window.onload = DisplayMemberList;
</script>

</body>
</html>
