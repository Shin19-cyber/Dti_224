<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurement Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Measurement Converter</h1>
    </div>

    <div class="section" style="text-align: center;">
        <label for="inchInput">Enter Inch: </label>
        <input type="number" id="inchInput" value="3" style="padding: 6px; width: 100px; font-size: 14px;">
        <button onclick="convertInchToCm()" class="back-button" style="padding: 6px 12px; margin-left: 5px;">Submit</button>

        <br><br>
        <div id="resultDisplay" style="font-weight: bold; font-size: 16px;">Equal to 7.62 cm</div>
    </div>

    <div class="button-container">
        <a href="index.html" class="back-button">Back to Menu</a>
    </div>
</div>

<script>
function convertInchToCm() {
    var inches = document.getElementById("inchInput").value;
    var cm = parseFloat(inches) * 2.54;
    document.getElementById("resultDisplay").innerHTML = "Equal to " + cm + " cm";
}
</script>

</body>
</html>
